packages:
  - "frontend"
  - "backend"

overrides:
  # firebase-functions pulls in @types/express@4; force one version (backend uses Express 5)
  '@types/express': '^5.0.1'
  # Security patches for transitive dependencies (see README § Security)
  postcss: '^8.5.18'
  sharp: '^0.35.5'
  js-yaml: '^4.3.2'
  nanoid: '^3.3.18'
  source-map-js: '^1.2.2'
  '@grpc/grpc-js': '^1.14.5'
  '@fastify/busboy': '^3.2.1'
  proxy-addr: '^2.0.8'

allowBuilds:
  "@firebase/util": true
  esbuild: true
  lefthook: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
